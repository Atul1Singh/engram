{{- if .Values.migrations.enabled -}}
{{- if .Values.secrets.create -}}
{{- fail "migrations.enabled requires an externally managed secrets.existingSecret created before Helm hooks run" -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "engram.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "engram.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "engram.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "engram.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["engram", "postgres-migrate"]
          env:
            - name: ENGRAM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "engram.secretName" . }}
                  key: ENGRAM_DATABASE_URL
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
