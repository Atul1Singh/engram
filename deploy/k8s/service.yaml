apiVersion: v1
kind: Service
metadata:
  name: engram
  namespace: engram
  labels:
    app.kubernetes.io/name: engram
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: engram
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: engram
  namespace: engram
