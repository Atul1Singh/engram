# Production-parity staging profile. Staging must use its own database,
# Temporal namespace, credentials, and model key.
api:
  host: "0.0.0.0"
  port: 8000
  api_key: ${ENGRAM_STAGING_API_KEY}
  admin_key: ${ENGRAM_STAGING_ADMIN_KEY}

core_model:
  provider: "openai_responses"
  model_path: "muse-spark-1.3-contributor"
  api_base: "https://opencode.ai/zen/go/v1"
  api_key: ${OPENCODE_GO_API_KEY}
  temperature: 1
  max_tokens: 2048
  reasoning_effort: "low"
  timeout_seconds: 60

frontier_llm:
  provider: "openai_responses"
  model_path: "muse-spark-1.3-contributor"
  api_base: "https://opencode.ai/zen/go/v1"
  api_key: ${OPENCODE_GO_API_KEY}
  temperature: 1
  reasoning_effort: "low"

filesystem:
  data_dir: "/var/lib/engram-staging/export"
  create_dirs: false

canonical_memory:
  enabled: true
  require_temporal: true
  allow_filesystem_runtime: false
  legacy_uri_status_code: 410
  artifact_retention_hours: 24

knowledge_graph:
  backend: "neo4j"
  uri: ${ENGRAM_STAGING_NEO4J_URI}
  writer_username: "neo4j"
  writer_password: ${ENGRAM_STAGING_NEO4J_PASSWORD}
  reader_username: "neo4j"
  reader_password: ${ENGRAM_STAGING_NEO4J_PASSWORD}

event_ledger:
  backend: "postgres"
  dsn: ${ENGRAM_STAGING_DATABASE_URL}
  reconciliation_interval_seconds: 60
  stale_overview_scan_interval_seconds: 86400

temporal:
  enabled: true
  address: ${ENGRAM_STAGING_TEMPORAL_ADDRESS}
  namespace: "engram-staging"
  ingest_task_queue: "engram-staging-ingest"
  code_ingest_task_queue: "engram-staging-code-ingest"
  projection_task_queue: "engram-staging-projection"
  consolidation_task_queue: "engram-staging-consolidation"
  maintenance_task_queue: "engram-staging-maintenance"
  worker_concurrency: 2
  maintenance_worker_concurrency: 1

decay:
  schedule: "0 3 * * *"
  schedule_timezone: "UTC"

session_cache:
  backend: "redis"
  redis_url: ${ENGRAM_STAGING_REDIS_URL}

retrieval:
  quality_mode: enforce
  max_l1_vector_results: 12
  overview_budget_tokens: 6000
  full_doc_budget_tokens: 20000

session:
  compaction_trigger_tokens: 64000
  compaction_target_ratio: 0.5
  compaction_input_tokens: 64000
  compaction_summary_tokens: 2000
