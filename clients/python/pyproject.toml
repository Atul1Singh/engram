[project]
name = "engram-client"
version = "0.1.0"
description = "Official Python client for the Engram memory management API"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engram_client"]
