[project]
name = "engram"
version = "0.1.0"
description = "Engram — AI Memory Management System (MVP per SDD v1.0)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0,<2",
    "tiktoken==0.14.0",
    "openai>=1.40.0",
    "sentence-transformers>=3.3.0",
    "neo4j>=5.25.0",
    "redis>=5.2.0",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0",
    "python-slugify>=8.0.4",
    "httpx>=0.27.0",
    "orjson>=3.10.11",
    "python-multipart>=0.0.20",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "prometheus-client>=0.21.0",
    "itsdangerous>=2.2.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-typescript>=0.23.2",
    "psycopg[binary,pool]>=3.2.0",
    "temporalio==1.32.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "selenium>=4.27.0",
    "webdriver-manager>=4.0.2",
    "playwright>=1.49.0",
    "pytest-playwright>=0.6.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12.20250516",
]
training = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "peft>=0.12.0",
    "trl>=0.10.0",
    "accelerate>=0.33.0",
]
tracing = [
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp>=1.26.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
]

[project.scripts]
engram = "engram.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Neo4j and Redis",
    "e2e: requires the full stack and API keys",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[[tool.mypy.overrides]]
module = [
    "opentelemetry.*",
    "peft.*",
]
ignore_missing_imports = true
