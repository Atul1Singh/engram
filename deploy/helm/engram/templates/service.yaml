apiVersion: v1
kind: Service
metadata:
  name: {{ include "engram.fullname" . }}
  labels: {{- include "engram.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "engram.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "engram.fullname" . }}
automountServiceAccountToken: false
