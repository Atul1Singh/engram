apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: engram
  namespace: engram
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: engram
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # Custom metric: scale on query latency p95. Requires the
    # prometheus-adapter installed; see deploy/k8s/prometheus-adapter-config.yaml
    - type: Pods
      pods:
        metric:
          name: engram_query_latency_seconds_p95
        target:
          type: AverageValue
          averageValue: "2"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
