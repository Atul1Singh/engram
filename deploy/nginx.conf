user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id" ${request_time}s';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # Match Engram's own body-size caps so nginx rejects oversized payloads first.
    client_max_body_size 4m;
    client_body_buffer_size 128k;

    # Generate / propagate request IDs. If the client sends one we keep it;
    # otherwise we let nginx generate and propagate to the upstream.
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # Basic rate limit at the edge (per IP). Engram has its own per-key limits;
    # this is DDoS hygiene for the TCP listener.
    limit_req_zone $binary_remote_addr zone=engram_ingest:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=engram_query:10m rate=60r/m;

    upstream engram_app {
        server engram:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ---- HTTP → HTTPS redirect --------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        # ACME challenge passthrough
        location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ---- TLS server --------------------------------------------------------
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers — the API doesn't serve HTML but these are cheap.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy no-referrer always;

        # /metrics and /livez are unauthenticated; allow only from internal net.
        location ~ ^/(metrics|livez|readyz)$ {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://engram_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/ingest {
            limit_req zone=engram_ingest burst=40 nodelay;
            proxy_pass http://engram_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id_final;
            proxy_read_timeout 30s;
        }

        location /api/v1/query {
            limit_req zone=engram_query burst=20 nodelay;
            proxy_pass http://engram_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id_final;
            proxy_buffering off;                 # SSE-friendly
            proxy_read_timeout 120s;
            chunked_transfer_encoding on;
        }

        location /api/v1/ {
            proxy_pass http://engram_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id_final;
            proxy_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }
}
