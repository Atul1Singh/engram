{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "engram.fullname" . }}-api
  labels: {{- include "engram.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "engram.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports:
        - { port: 8000, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.monitoringNamespaceLabels | nindent 14 }}
      ports:
        - { port: 8000, protocol: TCP }
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 443, protocol: TCP }
        - { port: 5432, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 7687, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "engram.fullname" . }}-worker
  labels: {{- include "engram.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "engram.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: temporal-worker
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 443, protocol: TCP }
        - { port: 5432, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 7233, protocol: TCP }
        - { port: 7687, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "engram.fullname" . }}-dispatcher
  labels: {{- include "engram.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "engram.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: temporal-dispatcher
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - ports:
        - { port: 5432, protocol: TCP }
        - { port: 7233, protocol: TCP }
{{- end }}
