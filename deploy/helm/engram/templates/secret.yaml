{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "engram.fullname" . }}-secrets
  labels: {{- include "engram.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENGRAM_API_KEY:        {{ required "secrets.apiKey is required"        .Values.secrets.apiKey | quote }}
  ENGRAM_ADMIN_KEY:      {{ .Values.secrets.adminKey | quote }}
  ENGRAM_SECRET_KEY:     {{ required "secrets.secretKey is required" .Values.secrets.secretKey | quote }}
  OPENCODE_GO_API_KEY:   {{ required "secrets.openCodeGoApiKey is required" .Values.secrets.openCodeGoApiKey | quote }}
  NEO4J_ADMIN_PASSWORD:  {{ required "secrets.neo4jAdminPassword is required" .Values.secrets.neo4jAdminPassword | quote }}
  ENGRAM_DATABASE_URL:   {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  NEO4J_AUTH:            {{ printf "neo4j/%s" .Values.secrets.neo4jAdminPassword | quote }}
{{- end }}
