apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: engram
  namespace: engram
  labels:
    release: kube-prometheus-stack     # matches the Helm release name of your prom-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: engram
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: engram
  namespace: engram
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: engram-availability
      interval: 30s
      rules:
        - alert: EngramInstanceDown
          expr: up{job="engram"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Engram instance down"

        - alert: EngramReadinessFailing
          expr: probe_success{job="engram-readyz"} == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Readiness probe failing"

    - name: engram-saturation
      interval: 30s
      rules:
        - alert: EngramConsolidationBacklog
          expr: engram_consolidation_queue_depth > 5000
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Consolidation backlog over 5000"

        - alert: EngramIngestFailures
          expr: |
            sum(rate(engram_ingest_events_total{final_status="FAILED"}[5m]))
              / clamp_min(sum(rate(engram_ingest_events_total[5m])), 0.01) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Ingest failure rate > 5%"

    - name: engram-latency
      interval: 30s
      rules:
        - alert: EngramQueryP95
          expr: histogram_quantile(0.95, sum(rate(engram_query_latency_seconds_bucket{phase="total"}[5m])) by (le)) > 8
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Query p95 latency > 8s"

        - alert: EngramFrontierReentry
          expr: histogram_quantile(0.9, sum(rate(engram_reentries_per_query_bucket[10m])) by (le)) > 1
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "Frontier re-entry p90 > 1 (coverage gap)"
