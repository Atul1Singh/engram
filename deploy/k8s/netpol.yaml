apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: engram-api
  namespace: engram
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: engram
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    # Ingress controller → API pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
    # Allow Prometheus in monitoring namespace to scrape /metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
  egress:
    # Neo4j + Redis within the namespace
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: neo4j
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Egress to the OpenCode Go Responses API over HTTPS
    - ports:
        - port: 443
          protocol: TCP
