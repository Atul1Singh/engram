# Engram config — Muse Spark via the OpenCode Go Responses API.
# Use: ENGRAM_CONFIG_PATH=./config.opencode-go.yaml python -m engram.cli smoke

api:
  host: "0.0.0.0"
  port: 8000
  api_key: ${ENGRAM_API_KEY}
  rate_limit_query_per_minute: 60
  rate_limit_ingest_per_minute: 600

gating:
  configuration: "dual"
  classifier_path: "./models/engram-gate-v1"
  embedding_model_path: "BAAI/bge-small-en-v1.5"
  classification_threshold: 0.3
  device: "cpu"
  max_batch_size: 32
  memory_hit_threshold: 0.75

core_model:
  # Muse Spark is exposed through OpenCode Go's Responses API.
  provider: "openai_responses"
  model_path: "muse-spark-1.3-contributor"
  api_base: "https://opencode.ai/zen/go/v1"
  api_key: ${OPENCODE_GO_API_KEY}
  # OpenCode Go's Muse Spark endpoint accepts only temperature=1.
  temperature: 1
  max_tokens: 2048
  reasoning_effort: "low"
  timeout_seconds: 60

frontier_llm:
  # Muse Spark is exposed by OpenCode Go through /responses, not
  # /chat/completions, so use Engram's dedicated Responses API adapter.
  provider: "openai_responses"
  model_path: "muse-spark-1.3-contributor"
  api_base: "https://opencode.ai/zen/go/v1"
  api_key: ${OPENCODE_GO_API_KEY}
  # OpenCode Go's Muse Spark endpoint accepts only temperature=1.
  temperature: 1
  max_tokens: 4096
  # Reserve enough tokens for the JSON verdict and answer rather than spending
  # the whole budget on hidden reasoning.
  reasoning_effort: "low"

filesystem:
  data_dir: "./data/mem"
  create_dirs: true
  tree_display_max_tokens: 2048

knowledge_graph:
  backend: "neo4j"
  uri: "bolt://localhost:7687"
  writer_username: "neo4j"
  writer_password: ${NEO4J_ADMIN_PASSWORD}
  reader_username: "neo4j"
  reader_password: ${NEO4J_ADMIN_PASSWORD}
  l2_query_timeout_seconds: 5
  l4_query_timeout_seconds: 15
  max_hops: 4

event_ledger:
  backend: "postgres"
  dsn: ${ENGRAM_DATABASE_URL}
  reconciliation_interval_seconds: 60

consolidation:
  poll_interval_seconds: 10
  max_concurrent_tasks: 4
  overview_max_tokens: 2048
  overview_debounce_seconds: 30
  manifest_update_delay_seconds: 5
  max_backlog: 10000

session_cache:
  backend: "redis"
  redis_url: "redis://localhost:6379"

retrieval:
  l0_skip: true
  max_reentries: 2
  max_depth: "L4"
  max_l1_vector_results: 12
  overview_budget_tokens: 6000
  full_doc_budget_tokens: 20000
  msc_compression_threshold: 0.8

decay:
  preset: "personal_conversation"
  schedule: "0 3 * * *"
  dormant_floor: 0.05

session:
  timeout_minutes: 30
  compaction_trigger_tokens: 64000
  compaction_target_ratio: 0.5
  compaction_input_tokens: 64000
  compaction_summary_tokens: 2000
