apiVersion: apps/v1
kind: Deployment
metadata:
  name: engram
  namespace: engram
  labels:
    app.kubernetes.io/name: engram
    app.kubernetes.io/component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: engram
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engram
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: engram
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engram
          image: ghcr.io/your-org/engram:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ENGRAM_CONFIG_PATH
              value: /etc/engram/config.yaml
            - name: ENGRAM_SESSION_COMPACTION_TRIGGER_TOKENS
              valueFrom: { configMapKeyRef: { name: engram-config, key: ENGRAM_SESSION_COMPACTION_TRIGGER_TOKENS } }
            - name: ENGRAM_SESSION_COMPACTION_TARGET_RATIO
              valueFrom: { configMapKeyRef: { name: engram-config, key: ENGRAM_SESSION_COMPACTION_TARGET_RATIO } }
            - name: ENGRAM_SESSION_COMPACTION_INPUT_TOKENS
              valueFrom: { configMapKeyRef: { name: engram-config, key: ENGRAM_SESSION_COMPACTION_INPUT_TOKENS } }
            - name: ENGRAM_SESSION_COMPACTION_SUMMARY_TOKENS
              valueFrom: { configMapKeyRef: { name: engram-config, key: ENGRAM_SESSION_COMPACTION_SUMMARY_TOKENS } }
            - name: ENGRAM_RETRIEVAL_QUALITY_MODE
              valueFrom: { configMapKeyRef: { name: engram-config, key: ENGRAM_RETRIEVAL_QUALITY_MODE } }
            - name: ENGRAM_LOG_FORMAT
              value: json
            - name: ENGRAM_LOG_LEVEL
              value: INFO
            - name: ENGRAM_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: engram
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=production
            # Secrets pulled from engram-secrets
            - name: ENGRAM_API_KEY
              valueFrom: { secretKeyRef: { name: engram-secrets, key: ENGRAM_API_KEY } }
            - name: ENGRAM_ADMIN_KEY
              valueFrom: { secretKeyRef: { name: engram-secrets, key: ENGRAM_ADMIN_KEY } }
            - name: ENGRAM_SECRET_KEY
              valueFrom: { secretKeyRef: { name: engram-secrets, key: ENGRAM_SECRET_KEY } }
            - name: OPENCODE_GO_API_KEY
              valueFrom: { secretKeyRef: { name: engram-secrets, key: OPENCODE_GO_API_KEY } }
            - name: NEO4J_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: engram-secrets, key: NEO4J_ADMIN_PASSWORD } }
            - name: ENGRAM_DATABASE_URL
              valueFrom: { secretKeyRef: { name: engram-secrets, key: ENGRAM_DATABASE_URL } }
          volumeMounts:
            - name: config
              mountPath: /etc/engram
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      volumes:
        - name: config
          configMap:
            name: engram-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: engram
              app.kubernetes.io/component: api
