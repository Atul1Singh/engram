{% extends "base.html" %}

{% block title %}Login - Engram Admin{% endblock %}

{% block head %}
<style>
  [data-theme="dark"] body { background-color: #1d1d20 !important; color: #efefef !important; }
  [data-theme="dark"] .bg-white { background-color: #1d1d20 !important; }
  [data-theme="dark"] .bg-neutral-100 { background-color: #2d2d32 !important; }
  [data-theme="dark"] .bg-neutral-50 { background-color: #252529 !important; }
  [data-theme="dark"] input { background-color: #252529 !important; color: #efefef !important; border-color: #3f3f46 !important; }
  [data-theme="dark"] input:focus { box-shadow: 0 0 0 2px rgba(255,255,255,0.1) !important; }
  [data-theme="dark"] button.bg-neutral-900 { background-color: #e5e5e5 !important; color: #18181b !important; }
  [data-theme="dark"] button.hover\:bg-neutral-800:hover { background-color: #d4d4d8 !important; }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-white relative overflow-hidden px-4">
  <div class="absolute inset-0 bg-grain pointer-events-none z-0"></div>
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[600px] h-[300px] bg-gradient-to-b from-neutral-100 to-transparent rounded-full blur-3xl -z-10 opacity-50"></div>
  <div class="w-full max-w-sm relative z-10">
    <div class="text-center mb-10 animate-fade-in-up">
      <div class="flex flex-col items-center justify-center mb-3">
        <img src="/admin/static/engram_logo.svg" alt="Engram" class="w-16 h-16 mb-3">
        <span class="text-4xl font-extrabold tracking-tight">Engram</span>
      </div>
    </div>
    <div class="bg-white rounded-2xl border border-neutral-200 p-6 sm:p-8 shadow-xl animate-fade-in-up">
      <h1 class="text-lg font-bold tracking-tight text-center mb-6">Admin Access</h1>
      <form x-data="loginForm()" @submit.prevent="submitLogin" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-neutral-700 mb-1.5">API Key</label>
          <input type="password" x-model="apiKey" class="w-full px-4 py-2.5 rounded-xl border border-neutral-200 bg-white text-sm placeholder-neutral-400 focus:border-neutral-900 transition-all" placeholder="Enter admin API key" required>
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-sm text-neutral-600">
            <input type="checkbox" x-model="remember" class="w-4 h-4 rounded border-neutral-300 text-neutral-900 focus:ring-neutral-900">
            Stay signed in
          </label>
        </div>
        <button type="submit" class="w-full py-2.5 bg-neutral-900 hover:bg-neutral-800 text-white font-semibold rounded-xl transition-all flex items-center justify-center gap-2">
          <span x-show="!loading">Sign in</span>
          <span x-show="loading">Signing in...</span>
        </button>
        <p x-show="error" x-text="error" class="text-sm text-red-600 text-center"></p>
      </form>
    </div>
  </div>
</div>

<script>
function loginForm() {
  return {
    apiKey: '',
    remember: false,
    loading: false,
    error: '',
    async submitLogin() {
      this.loading = true;
      this.error = '';
      try {
        const resp = await fetch('/admin/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ api_key: this.apiKey })
        });
        if (resp.ok) {
          localStorage.setItem('engram_api_key', this.apiKey);
          window.location.href = '/admin/dashboard';
        } else {
          this.error = 'Invalid API key';
        }
      } catch (e) {
        this.error = 'Connection error';
      }
      this.loading = false;
    }
  }
}
</script>
{% endblock %}
