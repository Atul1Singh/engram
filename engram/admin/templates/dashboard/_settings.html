<div x-show="mainTab === 'settings'" x-cloak>
    <div class="animate-fade-in-up">
        <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-8">
            <div>
                <h2 class="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-2">Configuration</h2>
                <h3 class="text-2xl font-bold tracking-tight text-neutral-900">Settings</h3>
            </div>
        </div>
        <div class="space-y-4">
            <div class="bg-white rounded-2xl border border-neutral-200 overflow-hidden">
                <div class="flex items-center justify-between px-6 py-4 bg-neutral-100 border-b border-neutral-200">
                    <div class="flex items-center gap-3">
                        <i data-lucide="globe" class="w-4 h-4 text-neutral-500"></i>
                        <span class="text-xs font-bold uppercase tracking-wider text-neutral-600">Language</span>
                    </div>
                </div>
                <div class="divide-y divide-neutral-100">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 px-4 sm:px-6 py-4">
                        <label class="text-sm text-neutral-700">Display Language</label>
                        <select x-model="language" @change="saveLanguage()" class="px-3 py-2 text-sm border border-neutral-200 rounded-lg focus:ring-2 focus:ring-neutral-900 focus:border-transparent transition-all bg-white">
                            <option value="en">English</option>
                            <option value="zh">中文</option>
                            <option value="zh-TW">繁體中文</option>
                            <option value="ko">한국어</option>
                            <option value="ja">日本語</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-neutral-200 overflow-hidden">
                <div class="flex items-center justify-between px-6 py-4 bg-neutral-100 border-b border-neutral-200">
                    <div class="flex items-center gap-3">
                        <i data-lucide="shield" class="w-4 h-4 text-neutral-500"></i>
                        <span class="text-xs font-bold uppercase tracking-wider text-neutral-600">Auth</span>
                    </div>
                </div>
                <div class="divide-y divide-neutral-100">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 px-4 sm:px-6 py-4">
                        <label class="text-sm text-neutral-700">Session Cookie</label>
                        <button @click="clearSession()" class="px-3 py-1.5 text-xs font-medium text-neutral-600 border border-neutral-200 rounded-lg hover:bg-neutral-100 transition-all">Clear Session</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
