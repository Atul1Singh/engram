# Production-oriented defaults. PostgreSQL, Temporal, Neo4j, Redis, and the
# referenced Secret must exist before installation. Runtime memory has no PVC.

image:
  repository: ghcr.io/your-org/engram
  tag: ""                      # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 3

resources:
  requests: { cpu: 500m,   memory: 1Gi }
  limits:   { cpu: 2000m,  memory: 4Gi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

pdb:
  enabled: true
  minAvailable: 2

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: engram.example.com
  tls:
    enabled: true
    secretName: engram-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

# External services — point at managed or in-cluster deployments.
neo4j:
  deployInCluster: false
  uri: "bolt://neo4j.engram.svc.cluster.local:7687"
  storageClass: ssd
  storage: 100Gi
  resources:
    requests: { cpu: 1000m, memory: 2Gi }
    limits:   { cpu: 4000m, memory: 8Gi }

redis:
  deployInCluster: false
  url: "redis://redis.engram.svc.cluster.local:6379"
  storageClass: ssd
  storage: 20Gi

# Production uses an externally managed Secret. Set create=true only for a
# non-production install with migrations disabled.
secrets:
  create: false
  existingSecret: engram-secrets
  apiKey: ""
  adminKey: ""
  secretKey: ""
  openCodeGoApiKey: ""
  neo4jAdminPassword: ""
  databaseUrl: ""

temporal:
  address: "temporal-frontend.temporal.svc.cluster.local:7233"
  namespace: "engram-prod"
  ingestTaskQueue: "engram-ingest"
  codeIngestTaskQueue: "engram-code-ingest"
  projectionTaskQueue: "engram-projection"
  consolidationTaskQueue: "engram-consolidation"
  maintenanceTaskQueue: "engram-maintenance"
  workerConcurrency: 4
  maintenanceWorkerConcurrency: 1
  dispatchIntervalSeconds: 1.0
  historyRetentionDays: 14

worker:
  queues:
    # One deployment hosts Temporal Workers for every task queue. Increase
    # replicaCount to scale ingestion and projection together.
    - { name: all, queue: all, replicaCount: 2 }
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests: { cpu: 1000m, memory: 2Gi }
    limits: { cpu: 3000m, memory: 6Gi }

dispatcher:
  replicaCount: 2
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

migrations:
  enabled: true
  backoffLimit: 2
  activeDeadlineSeconds: 600

config:
  retrieval:
    quality_mode: enforce
    l0_skip: false
    max_reentries: 2
    max_depth: L4
  consolidation:
    max_concurrent_tasks: 4
    max_backlog: 10000
  session:
    compaction_trigger_tokens: 64000
    compaction_target_ratio: 0.5
    compaction_input_tokens: 64000
    compaction_summary_tokens: 2000
    timeout_minutes: 30

tracing:
  enabled: false
  otlpEndpoint: ""             # e.g. http://otel-collector:4317

networkPolicy:
  enabled: true
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: monitoring

prometheus:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack

cronjobs:
  decay:
    # Temporal owns decay in production; this is intentionally disabled.
    enabled: false
    schedule: "0 3 * * *"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: engram
        app.kubernetes.io/component: api
