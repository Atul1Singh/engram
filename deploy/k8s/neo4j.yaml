# Minimal single-node Neo4j for dev/staging. For production use
# Neo4j AuraDB or Causal Cluster (needs Enterprise Edition).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: engram
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: neo4j }
  template:
    metadata:
      labels: { app.kubernetes.io/name: neo4j }
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.24-community
          ports:
            - { name: http,    containerPort: 7474 }
            - { name: bolt,    containerPort: 7687 }
          env:
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef: { name: engram-secrets, key: NEO4J_AUTH }
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: "1000m", memory: "2Gi" }
            limits:   { cpu: "4000m", memory: "8Gi" }
          readinessProbe:
            tcpSocket: { port: bolt }
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: neo4j-data }
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: engram
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: neo4j }
  ports:
    - { name: http, port: 7474 }
    - { name: bolt, port: 7687 }
