# Engram config — matches §15.1 of the SDD.
# Secrets are referenced via ${VAR} and resolved from environment.

api:
  host: "0.0.0.0"
  port: 8000
  api_key: ${ENGRAM_API_KEY}
  rate_limit_query_per_minute: 60
  rate_limit_ingest_per_minute: 600

gating:
  configuration: "dual"                       # "dual" | "unified"
  classifier_path: "./models/engram-gate-v1"  # unused in Phase 0 (regex-only)
  embedding_model_path: "BAAI/bge-small-en-v1.5"
  classification_threshold: 0.3
  device: "cpu"                               # "cpu" | "cuda"
  max_batch_size: 32
  memory_hit_threshold: 0.75

core_model:
  provider: "openai_responses"
  model_path: "muse-spark-1.3-contributor"
  api_base: "https://opencode.ai/zen/go/v1"
  api_key: ${OPENCODE_GO_API_KEY}
  temperature: 1.0
  max_tokens: 2048
  reasoning_effort: "low"
  timeout_seconds: 60

frontier_llm:
  provider: "openai_responses"
  model_path: "muse-spark-1.3-contributor"
  api_base: "https://opencode.ai/zen/go/v1"
  api_key: ${OPENCODE_GO_API_KEY}
  temperature: 1.0
  max_tokens: 4096
  reasoning_effort: "low"

filesystem:
  data_dir: "./data/mem"
  create_dirs: true
  tree_display_max_tokens: 2048

knowledge_graph:
  backend: "neo4j"
  uri: "bolt://localhost:7687"
  # Phase 0 uses Neo4j Community (single auth). Writer/reader RBAC per §12.3
  # requires Enterprise; in Phase 2 we'll split these or swap to Enterprise.
  writer_username: "neo4j"
  writer_password: ${NEO4J_ADMIN_PASSWORD}
  reader_username: "neo4j"
  reader_password: ${NEO4J_ADMIN_PASSWORD}
  l2_query_timeout_seconds: 5
  l4_query_timeout_seconds: 15
  max_hops: 4

event_ledger:
  backend: "postgres"
  dsn: ${ENGRAM_DATABASE_URL}
  reconciliation_interval_seconds: 60

# Enable Temporal when its server and workers are available. Workflow histories
# contain identifiers only; durable event payloads stay in PostgreSQL.
temporal:
  enabled: false
  address: "temporal:7233"
  namespace: "engram-prod"
  ingest_task_queue: "engram-ingest"
  consolidation_task_queue: "engram-consolidation"
  maintenance_task_queue: "engram-maintenance"
  worker_concurrency: 4
  maintenance_worker_concurrency: 1
  dispatch_interval_seconds: 1.0
  history_retention_days: 14

consolidation:
  poll_interval_seconds: 10
  max_concurrent_tasks: 4
  overview_max_tokens: 2048
  overview_debounce_seconds: 30
  manifest_update_delay_seconds: 5
  max_backlog: 10000

session_cache:
  backend: "redis"                            # "redis" | "memory" (dev only, single-process)
  redis_url: "redis://localhost:6379"

retrieval:
  l0_skip: false
  max_reentries: 2
  max_depth: "L4"
  max_l1_vector_results: 12
  overview_budget_tokens: 6000
  full_doc_budget_tokens: 20000
  msc_compression_threshold: 0.8

decay:
  preset: "personal_conversation"             # personal_conversation | coding_agent | knowledge_base
  schedule: "0 3 * * *"
  schedule_timezone: "UTC"
  dormant_floor: 0.05

session:
  timeout_minutes: 30
  compaction_trigger_tokens: 64000
  compaction_target_ratio: 0.5
  compaction_input_tokens: 64000
  compaction_summary_tokens: 2000
