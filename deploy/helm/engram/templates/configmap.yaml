apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "engram.fullname" . }}-config
data:
  ENGRAM_SESSION_COMPACTION_TRIGGER_TOKENS: {{ .Values.config.session.compaction_trigger_tokens | quote }}
  ENGRAM_SESSION_COMPACTION_TARGET_RATIO: {{ .Values.config.session.compaction_target_ratio | quote }}
  ENGRAM_SESSION_COMPACTION_INPUT_TOKENS: {{ .Values.config.session.compaction_input_tokens | quote }}
  ENGRAM_SESSION_COMPACTION_SUMMARY_TOKENS: {{ .Values.config.session.compaction_summary_tokens | quote }}
  ENGRAM_RETRIEVAL_QUALITY_MODE: {{ .Values.config.retrieval.quality_mode | quote }}
  config.yaml: |
    api:
      host: "0.0.0.0"
      port: 8000
      api_key: ${ENGRAM_API_KEY}
      admin_key: ${ENGRAM_ADMIN_KEY}
      rate_limit_query_per_minute: 120
      rate_limit_ingest_per_minute: 600
    gating:
      configuration: "dual"
      embedding_model_path: "BAAI/bge-small-en-v1.5"
      classification_threshold: 0.3
      device: "cpu"
    core_model:
      provider: "openai_responses"
      model_path: "muse-spark-1.3-contributor"
      api_base: "https://opencode.ai/zen/go/v1"
      api_key: ${OPENCODE_GO_API_KEY}
      temperature: 1.0
    frontier_llm:
      provider: "openai_responses"
      model_path: "muse-spark-1.3-contributor"
      api_base: "https://opencode.ai/zen/go/v1"
      api_key: ${OPENCODE_GO_API_KEY}
      temperature: 1.0
      reasoning_effort: "low"
    filesystem:
      data_dir: "/var/lib/engram/export"
      create_dirs: false
    canonical_memory:
      enabled: true
      require_temporal: true
      allow_filesystem_runtime: false
      legacy_uri_status_code: 410
      artifact_retention_hours: 24
    knowledge_graph:
      backend: "neo4j"
      uri: {{ .Values.neo4j.uri | default (printf "bolt://%s-neo4j:7687" (include "engram.fullname" .)) | quote }}
      writer_username: "neo4j"
      writer_password: ${NEO4J_ADMIN_PASSWORD}
      reader_username: "neo4j"
      reader_password: ${NEO4J_ADMIN_PASSWORD}
    event_ledger:
      backend: "postgres"
      dsn: ${ENGRAM_DATABASE_URL}
      reconciliation_interval_seconds: 60
      stale_overview_scan_interval_seconds: 86400
    temporal:
      enabled: true
      address: {{ .Values.temporal.address | quote }}
      namespace: {{ .Values.temporal.namespace | quote }}
      ingest_task_queue: {{ .Values.temporal.ingestTaskQueue | quote }}
      code_ingest_task_queue: {{ .Values.temporal.codeIngestTaskQueue | quote }}
      projection_task_queue: {{ .Values.temporal.projectionTaskQueue | quote }}
      consolidation_task_queue: {{ .Values.temporal.consolidationTaskQueue | quote }}
      maintenance_task_queue: {{ .Values.temporal.maintenanceTaskQueue | quote }}
      worker_concurrency: {{ .Values.temporal.workerConcurrency }}
      maintenance_worker_concurrency: {{ .Values.temporal.maintenanceWorkerConcurrency }}
      dispatch_interval_seconds: {{ .Values.temporal.dispatchIntervalSeconds }}
      history_retention_days: {{ .Values.temporal.historyRetentionDays }}
    consolidation:
      max_concurrent_tasks: {{ .Values.config.consolidation.max_concurrent_tasks }}
      max_backlog: {{ .Values.config.consolidation.max_backlog }}
    session_cache:
      backend: "redis"
      redis_url: {{ .Values.redis.url | default (printf "redis://%s-redis:6379" (include "engram.fullname" .)) | quote }}
    retrieval:
      quality_mode: {{ .Values.config.retrieval.quality_mode | quote }}
      l0_skip: {{ .Values.config.retrieval.l0_skip }}
      max_reentries: {{ .Values.config.retrieval.max_reentries }}
      max_depth: {{ .Values.config.retrieval.max_depth }}
    decay:
      preset: "personal_conversation"
      schedule: "0 3 * * *"
      schedule_timezone: "UTC"
    session:
      compaction_trigger_tokens: {{ .Values.config.session.compaction_trigger_tokens }}
      compaction_target_ratio: {{ .Values.config.session.compaction_target_ratio }}
      compaction_input_tokens: {{ .Values.config.session.compaction_input_tokens }}
      compaction_summary_tokens: {{ .Values.config.session.compaction_summary_tokens }}
      timeout_minutes: {{ .Values.config.session.timeout_minutes }}
